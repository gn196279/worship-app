name: gilgal_telugu_worship
description: A Telugu worship songs management app with PDF parsing and export capabilities
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  
  # PDF Handling
  file_picker: ^8.0.7
  pdf: ^3.10.7
  syncfusion_flutter_pdf: ^24.2.9
  
  # OCR for Image Text Recognition
  image: ^4.2.0
  image_picker: ^1.0.7
  http: ^1.2.1
  
  # Path utilities
  path_provider: ^2.1.2
  
  # UI Components
  cupertino_icons: ^1.0.6

  # Sharing functionality
  share_plus: ^7.2.1

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.7
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  google_sign_in: ^6.2.1
  open_filex: ^4.7.0
  custom_flutter_chord: ^1.0.2
  pdfx: ^2.6.0
  google_mlkit_text_recognition: ^0.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  screenshot: ^2.5.0
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  
  assets:
    - all_songs.txt
    - assets/songs.json
    - assets/google_g.png
    - assets/fonts/
  fonts:
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
        - asset: assets/fonts/NotoSansTelugu-Bold.ttf
          weight: 700
